name: Build Positron Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Kernel variant to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - ksu
          - normal
      create_release:
        description: 'Publish GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - memcg-fix
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, ksu]

    steps:
      - name: Determine if variant should run
        id: check_variant
        run: |
          TARGET="${{ github.event.inputs.variant }}"
          CURRENT="${{ matrix.variant }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "both" ] && [ "$TARGET" != "$CURRENT" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping $CURRENT because target variant is $TARGET"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Running build for $CURRENT"
          fi

      - name: Free Disk Space & Setup 16GB Swap
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          
          echo "Setting up 16GB swap file to prevent OOM during LTO link..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout Source Code
        if: steps.check_variant.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Environment Variables
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          BUILD_DATE=$(date -u +%Y%m%d)
          BUILD_TIME=$(date -u +%Y%m%d-%H%M)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Install Build Dependencies
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libssl-dev libelf-dev lz4 xz-utils zip bsdiff python3

      - name: Download & Set up Clang (LLVM 22.1.7)
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          mkdir -p llvm
          echo "Downloading ClangBuiltLinux LLVM 22.1.7..."
          curl -sSL --retry 3 "https://cdn.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz" | tar -xJ --strip-components=1 -C llvm
          echo "$GITHUB_WORKSPACE/llvm/bin" >> $GITHUB_PATH

      - name: Setup ccache
        if: steps.check_variant.outputs.should_run == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ${{ matrix.variant }}-
          max-size: 4G

      - name: Configure Kernel
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/llvm/bin:$PATH"

          echo "Generating defconfig..."
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            veux_defconfig

          echo "Enabling ThinLTO to optimize memory footprint during linking..."
          bash ./scripts/config --file out/.config -e THINLTO

          if [ "${{ matrix.variant }}" = "ksu" ]; then
            echo "Enabling KernelSU (CONFIG_KSU=y)..."
            bash ./scripts/config --file out/.config -e KSU
          else
            echo "Disabling KernelSU (CONFIG_KSU not set)..."
            bash ./scripts/config --file out/.config -d KSU
          fi

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo "=== Resolved memory and debug configs in out/.config ==="
          grep -E "CONFIG_MEMCG|CONFIG_DEBUG_KERNEL|CONFIG_DEBUG_LIST|CONFIG_DEBUG_ATOMIC_SLEEP" out/.config || true

      - name: Compile Kernel & DTB
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/llvm/bin:$PATH"
          export KBUILD_BUILD_USER="rhythmcache"
          export KBUILD_BUILD_HOST="github-actions"

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image dtbs

      - name: Verify Build Outputs
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Kernel Image was not generated!"
            exit 1
          fi

          DTB_PATH=$(find out/arch/arm64/boot/dts -name "veux.dtb" | head -n 1)
          if [ -z "$DTB_PATH" ] || [ ! -f "$DTB_PATH" ]; then
            echo "::error::veux.dtb was not generated!"
            exit 1
          fi

          echo "Kernel Image size: $(stat -c%s out/arch/arm64/boot/Image) bytes"
          echo "Found DTB: $DTB_PATH (size: $(stat -c%s "$DTB_PATH") bytes)"
          echo "DTB_PATH=$DTB_PATH" >> $GITHUB_ENV

      - name: Package AnyKernel3 Flashable Zip
        if: steps.check_variant.outputs.should_run == 'true'
        run: |
          VARIANT="${{ matrix.variant }}"
          if [ "$VARIANT" = "ksu" ]; then
            ZIP_NAME="positron-veux-${BUILD_DATE}-KSU.zip"
          else
            ZIP_NAME="positron-veux-${BUILD_DATE}-Standard.zip"
          fi

          PACKAGE_DIR="package_${VARIANT}"
          mkdir -p "$PACKAGE_DIR"
          cp -r anykernel/* "$PACKAGE_DIR"/
          cp out/arch/arm64/boot/Image "$PACKAGE_DIR"/Image
          cp "$DTB_PATH" "$PACKAGE_DIR"/dtb

          chmod +x "$PACKAGE_DIR"/anykernel.sh \
                   "$PACKAGE_DIR"/META-INF/com/google/android/update-binary \
                   "$PACKAGE_DIR"/tools/* 2>/dev/null || true

          cd "$PACKAGE_DIR"
          zip -r9 "../${ZIP_NAME}" * -x ".git*" "README.md"
          cd ..

          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

          mkdir -p build_output
          cp "${ZIP_NAME}" build_output/
          cp "${ZIP_NAME}.sha256" build_output/
          cp out/arch/arm64/boot/Image "build_output/Image_${VARIANT}"
          cp "$DTB_PATH" build_output/dtb

      - name: Upload Build Artifacts
        if: steps.check_variant.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: positron-veux-${{ matrix.variant }}
          path: build_output/*
          retention-days: 7

  release:
    name: Package & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || inputs.create_release == true || inputs.create_release == 'true')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bsdiff zip

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          BUILD_DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)

          # Copy individual zips and checksums
          find all_artifacts -name "*.zip" -exec cp {} release_assets/ \;
          find all_artifacts -name "*.sha256" -exec cp {} release_assets/ \;

          # Find raw Image files to create unified bsdiff zip if both were built
          IMAGE_NORMAL=$(find all_artifacts -name "Image_normal" | head -n 1)
          IMAGE_KSU=$(find all_artifacts -name "Image_ksu" | head -n 1)
          DTB_FILE=$(find all_artifacts -name "dtb" | head -n 1)

          if [ -n "$IMAGE_NORMAL" ] && [ -n "$IMAGE_KSU" ] && [ -n "$DTB_FILE" ]; then
            echo "Both normal and KSU images present. Creating Unified bsdiff zip..."
            bsdiff "$IMAGE_NORMAL" "$IMAGE_KSU" ksu.bdf

            UNIFIED_DIR="package_unified"
            mkdir -p "$UNIFIED_DIR"
            cp -r anykernel/* "$UNIFIED_DIR"/
            cp "$IMAGE_NORMAL" "$UNIFIED_DIR"/Image
            cp "$DTB_FILE" "$UNIFIED_DIR"/dtb
            cp ksu.bdf "$UNIFIED_DIR"/ksu.bdf

            chmod +x "$UNIFIED_DIR"/anykernel.sh \
                     "$UNIFIED_DIR"/META-INF/com/google/android/update-binary \
                     "$UNIFIED_DIR"/tools/* 2>/dev/null || true

            UNIFIED_ZIP="positron-veux-${BUILD_DATE}-Unified.zip"
            cd "$UNIFIED_DIR"
            zip -r9 "../release_assets/${UNIFIED_ZIP}" * -x ".git*" "README.md"
            cd ..

            cd release_assets
            sha256sum "${UNIFIED_ZIP}" > "${UNIFIED_ZIP}.sha256"
            cd ..
          fi

          echo "Final release assets:"
          ls -la release_assets/
          echo "TAG_NAME=v${BUILD_DATE}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Positron Kernel for POCO X4 Pro 5G (${{ env.TAG_NAME }})
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            ## Positron Kernel for POCO X4 Pro 5G (`veux` / `peux`)
            
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Toolchain:** ClangBuiltLinux LLVM 22.1.7
            - **Kernel Release:** `5.4.302~positron`
            
            ### Included Packages:
            - **`positron-veux-*-Standard.zip`**: Non-root clean kernel.
            - **`positron-veux-*-KSU.zip`**: KernelSU root support pre-compiled into `Image`.
            - **`positron-veux-*-Unified.zip`**: Dual-mode package using `ksu.bdf` delta patch (matches upstream release format).
            
            ### Flashing Instructions:
            1. Boot into custom recovery (TWRP / OrangeFox).
            2. Flash your preferred zip package.
            3. Reboot system.
